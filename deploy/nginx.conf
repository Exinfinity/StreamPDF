# =============================================================================
# StreamPDF —— nginx 站点配置（P3 加固）
# =============================================================================
#
# 文件结构：
#   1. limit_req_zone / limit_conn_zone —— http 上下文，名称统一 streampdf_ 前缀
#   2. upstream streampdf_upstream     —— http 上下文，仅回环 127.0.0.1:3000
#   3. server { listen 443 ssl; ... }  —— TLS、安全头、限流、反向代理
#
# -----------------------------------------------------------------------------
# 安装
# -----------------------------------------------------------------------------
#
#   Debian / Ubuntu（sites-available + sites-enabled）：
#     sudo install -m 0644 deploy/nginx.conf \
#          /etc/nginx/sites-available/streampdf.conf
#     sudo ln -s /etc/nginx/sites-available/streampdf.conf \
#                /etc/nginx/sites-enabled/streampdf.conf
#
#   RHEL / Fedora / Arch / Alpine / 容器镜像（conf.d）：
#     sudo install -m 0644 deploy/nginx.conf /etc/nginx/conf.d/streampdf.conf
#
# -----------------------------------------------------------------------------
# 生效前替换
# -----------------------------------------------------------------------------
#
#   - server_name 与 ssl_certificate / ssl_certificate_key 里的 pdf.example.com
#     换成真实域名；该域名必须同时出现在应用的 ALLOWED_HOSTS 中。
#   - 证书路径换成实际路径（示例为 certbot 默认位置）。
#   - 应用继续监听 127.0.0.1:3000（deploy/streampdf.service 或
#     deploy/docker-compose.yml），本文件是唯一公网入口。
#   - `http2 on;` 需要 nginx >= 1.25.1；旧版本改为 `listen 443 ssl http2;`
#     并删除 `http2 on;` 这一行。
#
#   校验并热加载：
#     sudo nginx -t && sudo systemctl reload nginx
#
# =============================================================================

# --- http 上下文：限流区（名称唯一，可与其它站点共存） -----------------------
limit_req_zone  $binary_remote_addr zone=streampdf_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=streampdf_conn:10m;

# --- http 上下文：唯一后端，只监听回环 ---------------------------------------
upstream streampdf_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 443 ssl;
  # nginx >= 1.25.1；旧版本写法见文件头。
  http2 on;
  server_name pdf.example.com;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  default_type application/octet-stream;
  # 不压缩 Range 响应。
  gzip off;

  ssl_certificate     /etc/letsencrypt/live/pdf.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pdf.example.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  # 池名加 streampdf_ 前缀只为避开其它站点的 shared:SSL；大小与原来一致。
  ssl_session_cache   shared:streampdf_ssl:10m;
  ssl_session_timeout 1d;

  # 应用在 ENABLE_HSTS=1 时也会发 HSTS；这里做纵深防御，错误页同样带上。
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 60s;

  # 可选的代理层认证（推荐与应用 bearer token 叠加）。三选一：
  # auth_basic "StreamPDF";
  # auth_basic_user_file /etc/nginx/.htpasswd;
  # auth_request /oauth2/auth;

  location / {
    limit_req  zone=streampdf_req burst=20 nodelay;
    limit_conn streampdf_conn 20;

    proxy_pass http://streampdf_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # 不提供点文件 / 仓库元数据。
  location ~ /\.(?!well-known) {
    deny all;
  }
}
