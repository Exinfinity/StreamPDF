# StreamPDF hardened nginx reference configuration (P3).
#
# - Terminates TLS and only proxies to a loopback-bound Node process.
# - Applies request/connection limits and a small request-body cap.
# - Forwards the original Host so the application Host allowlist keeps working.
# - Keeps proxy buffering off and compression off so HTTP Range semantics stay
#   byte-exact for the streaming PDF viewer.
#
# Replace pdf.example.com and the certificate paths before use.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  sendfile on;
  keepalive_timeout 65;

  # Do not compress Range responses.
  gzip off;

  # Per-IP rate and connection limits (tune to real traffic).
  limit_req_zone  $binary_remote_addr zone=streampdf_req:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=streampdf_conn:10m;

  upstream streampdf_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
  }

  server {
    listen 443 ssl;
    # `http2 on` requires nginx >= 1.25.1. On older versions use
    # `listen 443 ssl http2;` instead.
    http2 on;
    server_name pdf.example.com;

    ssl_certificate     /etc/letsencrypt/live/pdf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is also sent by the app when ENABLE_HSTS=1; keep it here as defence
    # in depth so it is present even for error pages.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 60s;

    # Optional authentication at the proxy layer (recommended in addition to
    # the application bearer token). Choose one:
    # auth_basic "StreamPDF";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # auth_request /oauth2/auth;

    location / {
      limit_req  zone=streampdf_req burst=20 nodelay;
      limit_conn streampdf_conn 20;

      proxy_pass http://streampdf_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Do not serve dotfiles or repository metadata.
    location ~ /\.(?!well-known) {
      deny all;
    }
  }

  # Redirect plain HTTP to HTTPS.
  server {
    listen 80;
    server_name pdf.example.com;
    return 301 https://$host$request_uri;
  }
}
