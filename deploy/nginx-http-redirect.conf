# =============================================================================
# StreamPDF —— 可选的 HTTP -> HTTPS 跳转
# =============================================================================
# 安装（宿主机 80 端口已有该域名的站点时跳过）
# -----------------------------------------------------------------------------
#
#     sudo install -m 0644 deploy/nginx-http-redirect.conf \
#          /etc/nginx/conf.d/streampdf-redirect.conf
#     Debian 系同理放进 sites-available 并建软链。
#
# =============================================================================

server {
  listen 80;
  server_name pdf.example.com;
  return 301 https://$host$request_uri;
}
