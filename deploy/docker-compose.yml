# StreamPDF hardened Compose deployment (P3).
#
#   export AUTH_TOKEN="$(node -e "console.log(require('node:crypto').randomBytes(32).toString('base64url'))")"
#   export ALLOWED_HOSTS=pdf.example.com
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The service is published on loopback only. Put nginx/Caddy (see
# deploy/nginx.conf) in front of it for TLS, authentication and rate limiting.

services:
  streampdf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: streampdf:local
    container_name: streampdf
    restart: unless-stopped
    init: true
    stop_grace_period: 10s

    # Runtime hardening
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"

    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # Fail closed if the operator forgot to export the secrets.
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?set ALLOWED_HOSTS to the public/intranet hostname/IP}"
      AUTH_TOKEN: "${AUTH_TOKEN:?set AUTH_TOKEN to a long random value}"
      TRUST_PROXY: "1"
      ENABLE_HSTS: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_LOG_INTERVAL_MINUTES: ${METRICS_LOG_INTERVAL_MINUTES:-15}
      # ALLOWED_ORIGINS: https://app.example.com
      # ENABLE_METRICS: "1"

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
